; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
[platformio]
default_envs = m5stack-cores3-stackchan-body

[common]
monitor_speed = 115200
lib_deps_external = 
	arduino-libraries/ArduinoBLE@^1.3.5
  m5stack/M5Unified@0.2.26
  hideakitai/TaskManager@^0.5.2
	https://github.com/botamochi6277/stackchan-display.git#0.4.0
  https://github.com/botamochi6277/StackChan-BSP.git#3c9e714
build_flags = 
  -std=gnu++17
  -DCORE_DEBUG_LEVEL=3
build_unflags =
  -std=gnu++11

[env:m5stack-core1]
platform = espressif32
board = m5stack-core-esp32
framework = arduino
monitor_speed = ${common.monitor_speed}
lib_deps = 
      ${common.lib_deps_external}

[env:m5stack-core2]
platform = espressif32
board = m5stack-core2
framework = arduino

monitor_speed = ${common.monitor_speed}
lib_deps = 
  ${common.lib_deps_external}
  

[env:m5stack-cores3]
board = m5stack-cores3
platform = espressif32
framework = arduino

monitor_speed = ${common.monitor_speed}
lib_deps = 
  ${common.lib_deps_external}

[env:m5stack-cores3-stackchan-body]
board = m5stack-cores3
platform = espressif32
framework = arduino

monitor_speed = ${common.monitor_speed}
lib_deps = 
  ${common.lib_deps_external}
build_flags = 
  ${common.build_flags}
  -DSTACKCHAN_BODY
  -DUART_SCLK_DEFAULT=UART_SCLK_APB
build_unflags =
  ${common.build_unflags}

; Same as m5stack-cores3-stackchan-body, but built with pioarduino (Arduino-ESP32 3.x / ESP-IDF 5.x)
; https://github.com/pioarduino/platform-espressif32
[env:m5stack-cores3-stackchan-body-pioarduino]
extends = env:m5stack-cores3-stackchan-body
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
; UART_SCLK_DEFAULT is defined by Arduino-ESP32 3.x / ESP-IDF 5.x, so the workaround flag is not needed
build_flags =
  ${common.build_flags}
  -DSTACKCHAN_BODY
