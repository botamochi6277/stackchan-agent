# Build the firmware with pioarduino (Arduino-ESP32 3.x / ESP-IDF 5.x) instead of the stock espressif32 platform.
# pioarduino: https://github.com/pioarduino/platform-espressif32
# The environment is defined in platformio.ini.
name: pioarduino CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
          key: ${{ runner.os }}-pioarduino-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pioarduino-
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio
      - name: Build with pioarduino
        run: pio run -e m5stack-cores3-stackchan-body-pioarduino
